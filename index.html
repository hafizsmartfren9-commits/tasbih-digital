<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Tasbih Pro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            color: #f5f7f5;
            font-family: Inter, Segoe UI, Arial, sans-serif;
            background:
                radial-gradient(circle at 50% -10%, #174d42 0%, transparent 40%),
                linear-gradient(145deg, #03120f, #071c18 50%, #020907);
            overflow-x: hidden;
        }

        /* Background */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .12;
            background-image:
                radial-gradient(circle, white 1px, transparent 1px);
            background-size: 35px 35px;
        }

        .container {
            width: min(1100px, 92%);
            margin: auto;
            padding: 35px 0 60px;
        }

        /* Header */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logoIcon {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            font-size: 23px;
            background: linear-gradient(135deg, #d6b86a, #8c6b2c);
            box-shadow: 0 0 30px rgba(214, 184, 106, .2);
        }

        .logo h1 {
            font-size: 20px;
        }

        .logo small {
            display: block;
            color: #78958e;
            font-size: 11px;
            margin-top: 3px;
        }

        .date {
            color: #9eb6b0;
            font-size: 13px;
        }

        /* Main */

        .grid {
            display: grid;
            grid-template-columns: 1.25fr .75fr;
            gap: 20px;
        }

        .card {
            border: 1px solid rgba(255, 255, 255, .09);
            background: rgba(255, 255, 255, .055);
            backdrop-filter: blur(18px);
            border-radius: 28px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .22);
        }

        /* Tasbih */

        .tasbih {
            padding: 35px;
            text-align: center;
        }

        .label {
            color: #779890;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 11px;
        }

        .dzikir {
            margin-top: 10px;
            font-size: 28px;
            font-weight: 800;
        }

        .arabic {
            margin-top: 8px;
            color: #d7bd76;
            font-size: 20px;
        }

        .counterWrap {
            width: 260px;
            height: 260px;
            margin: 35px auto;
            position: relative;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background:
                conic-gradient(#d6b86a var(--progress),
                    rgba(255, 255, 255, .07) 0);
            box-shadow:
                0 0 50px rgba(214, 184, 106, .08),
                inset 0 0 40px rgba(0, 0, 0, .35);
        }

        .counterWrap::before {
            content: "";
            position: absolute;
            width: 225px;
            height: 225px;
            border-radius: 50%;
            background: #071713;
            border: 1px solid rgba(255, 255, 255, .08);
        }

        .counter {
            position: relative;
            z-index: 2;
        }

        .counterNumber {
            font-size: 65px;
            font-weight: 900;
            line-height: 1;
        }

        .targetText {
            color: #75918a;
            margin-top: 8px;
            font-size: 12px;
        }

        /* Tap button */

        .tap {
            width: 190px;
            height: 64px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            color: #10130e;
            font-size: 17px;
            font-weight: 900;
            background: linear-gradient(135deg, #ead18b, #b9954a);
            box-shadow:
                0 10px 30px rgba(214, 184, 106, .2),
                inset 0 1px rgba(255, 255, 255, .5);
            transition: .15s;
        }

        .tap:active {
            transform: scale(.93);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 11px 15px;
            border-radius: 13px;
            color: #d4dfdc;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .08);
            cursor: pointer;
        }

        .btn:hover {
            background: rgba(255, 255, 255, .1);
        }

        /* Side */

        .side {
            padding: 25px;
        }

        .sideTitle {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .option {
            width: 100%;
            padding: 14px;
            margin-bottom: 9px;
            border-radius: 15px;
            text-align: left;
            color: #d9e4e1;
            background: rgba(255, 255, 255, .04);
            border: 1px solid transparent;
            cursor: pointer;
        }

        .option:hover,
        .option.active {
            border-color: rgba(214, 184, 106, .4);
            background: rgba(214, 184, 106, .08);
        }

        .option strong {
            display: block;
            font-size: 14px;
        }

        .option span {
            color: #708c85;
            font-size: 11px;
        }

        /* Stats */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .stat {
            padding: 17px;
            text-align: center;
            border-radius: 17px;
            background: rgba(255, 255, 255, .035);
        }

        .statIcon {
            font-size: 20px;
        }

        .statValue {
            margin-top: 6px;
            font-size: 20px;
            font-weight: 800;
        }

        .statLabel {
            color: #718c86;
            font-size: 10px;
            margin-top: 3px;
        }

        /* Bottom */

        .bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .progressCard,
        .streakCard {
            padding: 25px;
        }

        .progressBar {
            height: 9px;
            margin-top: 15px;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255, 255, 255, .07);
        }

        .progressFill {
            width: 0%;
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(90deg, #b89247, #f0d993);
            transition: .3s;
        }

        .streakNumber {
            font-size: 42px;
            font-weight: 900;
            margin-top: 10px;
        }

        .streakText {
            color: #78928c;
            font-size: 13px;
        }

        /* Flash animation */

        .flash {
            animation: flash .3s ease;
        }

        @keyframes flash {
            50% {
                filter: brightness(1.7);
                transform: scale(1.04);
            }
        }

        /* Toast */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translate(-50%, 100px);
            padding: 13px 20px;
            border-radius: 14px;
            background: rgba(15, 30, 25, .95);
            border: 1px solid rgba(214, 184, 106, .3);
            color: #eee;
            opacity: 0;
            transition: .3s;
            pointer-events: none;
        }

        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        /* Responsive */

        @media(max-width:800px) {

            .grid,
            .bottom {
                grid-template-columns: 1fr;
            }

            .date {
                display: none;
            }

        }

        @media(max-width:500px) {

            .container {
                width: 94%;
            }

            .tasbih {
                padding: 25px 15px;
            }

            .counterWrap {
                width: 225px;
                height: 225px;
            }

            .counterWrap::before {
                width: 195px;
                height: 195px;
            }

            .counterNumber {
                font-size: 55px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

        }
    </style>
</head>

<body>

    <div class="container">

        <header>

            <div class="logo">
                <div class="logoIcon">📿</div>

                <div>
                    <h1>Digital Tasbih</h1>
                    <small>Modern Dhikr Counter</small>
                </div>
            </div>

            <div class="date" id="date"></div>

        </header>


        <div class="grid">

            <!-- TASBIH -->

            <section class="card tasbih">

                <div class="label">Current Dhikr</div>

                <div class="dzikir" id="dzikir">
                    Subhanallah
                </div>

                <div class="arabic" id="arabic">
                    سُبْحَانَ اللّٰهِ
                </div>

                <div class="counterWrap" id="circle" style="--progress:0%">

                    <div class="counter">

                        <div class="counterNumber" id="counter">0</div>

                        <div class="targetText" id="targetText">
                            Target 33
                        </div>

                    </div>

                </div>

                <button class="tap" onclick="countDhikr()">
                    TAP TO COUNT
                </button>

                <div class="buttons">

                    <button class="btn" onclick="undo()">
                        ↶ Undo
                    </button>

                    <button class="btn" onclick="resetCounter()">
                        ↻ Reset
                    </button>

                </div>

            </section>


            <!-- DHIKR MENU -->

            <aside class="card side">

                <div class="sideTitle">
                    Choose Dhikr
                </div>

                <button class="option active" onclick="selectDhikr(
                'Subhanallah',
                'سُبْحَانَ اللّٰهِ',
                this
            )">
                    <strong>Subhanallah</strong>
                    <span>Maha Suci Allah</span>
                </button>

                <button class="option" onclick="selectDhikr(
                'Alhamdulillah',
                'الْحَمْدُ لِلّٰهِ',
                this
            )">
                    <strong>Alhamdulillah</strong>
                    <span>Segala puji bagi Allah</span>
                </button>

                <button class="option" onclick="selectDhikr(
                'Allahu Akbar',
                'اللّٰهُ أَكْبَرُ',
                this
            )">
                    <strong>Allahu Akbar</strong>
                    <span>Allah Maha Besar</span>
                </button>

                <button class="option" onclick="selectDhikr(
                'Astaghfirullah',
                'أَسْتَغْفِرُ اللّٰهَ',
                this
            )">
                    <strong>Astaghfirullah</strong>
                    <span>Aku memohon ampun kepada Allah</span>
                </button>


                <div class="sideTitle" style="margin-top:25px">
                    Target
                </div>

                <div class="stats">

                    <button class="stat btn" onclick="setTarget(33)">
                        <div class="statIcon">🌱</div>
                        <div class="statValue">33</div>
                        <div class="statLabel">SHORT</div>
                    </button>

                    <button class="stat btn" onclick="setTarget(99)">
                        <div class="statIcon">🌙</div>
                        <div class="statValue">99</div>
                        <div class="statLabel">STANDARD</div>
                    </button>

                    <button class="stat btn" onclick="setTarget(100)">
                        <div class="statIcon">⭐</div>
                        <div class="statValue">100</div>
                        <div class="statLabel">CUSTOM</div>
                    </button>

                </div>

            </aside>

        </div>


        <!-- BOTTOM -->

        <div class="bottom">

            <section class="card progressCard">

                <div class="sideTitle">
                    Today's Progress
                </div>

                <div>
                    <span id="progressText">0 / 100</span>
                </div>

                <div class="progressBar">
                    <div class="progressFill" id="progressFill"></div>
                </div>

            </section>


            <section class="card streakCard">

                <div class="sideTitle">
                    🔥 Daily Streak
                </div>

                <div class="streakNumber" id="streak">
                    1
                </div>

                <div class="streakText">
                    Keep your dhikr journey going.
                </div>

            </section>

        </div>

    </div>


    <div class="toast" id="toast">
        Dhikr completed ✨
    </div>


    <script>

        /* =========================
           DATA
        ========================= */

        let count = Number(
            localStorage.getItem("tasbihCount")
        ) || 0;

        let target = Number(
            localStorage.getItem("tasbihTarget")
        ) || 33;

        let streak = Number(
            localStorage.getItem("tasbihStreak")
        ) || 1;

        let totalToday = Number(
            localStorage.getItem("tasbihToday")
        ) || 0;


        /* =========================
           ELEMENTS
        ========================= */

        const counter =
            document.getElementById("counter");

        const circle =
            document.getElementById("circle");

        const targetText =
            document.getElementById("targetText");

        const progressFill =
            document.getElementById("progressFill");

        const progressText =
            document.getElementById("progressText");

        const streakElement =
            document.getElementById("streak");


        /* =========================
           UPDATE UI
        ========================= */

        function updateUI() {

            counter.innerText = count;

            targetText.innerText =
                "Target " + target;

            let percent =
                Math.min((count / target) * 100, 100);

            circle.style.setProperty(
                "--progress",
                percent + "%"
            );

            progressFill.style.width =
                Math.min(totalToday / 100 * 100, 100) + "%";

            progressText.innerText =
                totalToday + " / 100";

            streakElement.innerText =
                streak;

            localStorage.setItem(
                "tasbihCount",
                count
            );

            localStorage.setItem(
                "tasbihTarget",
                target
            );

            localStorage.setItem(
                "tasbihToday",
                totalToday
            );

            localStorage.setItem(
                "tasbihStreak",
                streak
            );
        }


        /* =========================
           COUNT
        ========================= */

        function countDhikr() {

            count++;
            totalToday++;

            counter.classList.remove("flash");

            void counter.offsetWidth;

            counter.classList.add("flash");

            updateUI();

            if (count >= target) {

                showToast(
                    "✨ Target selesai! Alhamdulillah."
                );

                streak++;

                count = 0;

                setTimeout(() => {
                    updateUI();
                }, 500);

            }

        }


        /* =========================
           UNDO
        ========================= */

        function undo() {

            if (count > 0) {

                count--;

                if (totalToday > 0) {
                    totalToday--;
                }

                updateUI();
            }

        }


        /* =========================
           RESET
        ========================= */

        function resetCounter() {

            count = 0;

            updateUI();

            showToast(
                "Counter telah di-reset."
            );

        }


        /* =========================
           TARGET
        ========================= */

        function setTarget(number) {

            target = number;

            count = 0;

            updateUI();

            showToast(
                "Target diubah menjadi " + number
            );

        }


        /* =========================
           DHIKR
        ========================= */

        function selectDhikr(
            name,
            arabic,
            element
        ) {

            document.getElementById(
                "dzikir"
            ).innerText = name;

            document.getElementById(
                "arabic"
            ).innerText = arabic;

            document
                .querySelectorAll(".option")
                .forEach(btn => {
                    btn.classList.remove("active");
                });

            element.classList.add("active");

            count = 0;

            updateUI();

        }


        /* =========================
           TOAST
        ========================= */

        function showToast(message) {

            const toast =
                document.getElementById("toast");

            toast.innerText = message;

            toast.classList.add("show");

            setTimeout(() => {
                toast.classList.remove("show");
            }, 1800);

        }


        /* =========================
           DATE
        ========================= */

        function updateDate() {

            const now = new Date();

            document.getElementById(
                "date"
            ).innerText =
                now.toLocaleDateString(
                    "id-ID",
                    {
                        weekday: "long",
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );

        }


        /* =========================
           KEYBOARD
        ========================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (event.code === "Space") {

                    event.preventDefault();

                    countDhikr();

                }

            }
        );


        /* START */

        updateDate();
        updateUI();

    </script>

</body>

</html>
